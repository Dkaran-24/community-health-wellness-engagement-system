; .user.ini — PHP settings for InfinityFree / CGI-FastCGI hosts
; This is the correct way to set PHP limits on hosts where .htaccess
; php_value directives cause HTTP 500 errors.

upload_max_filesize = 6M
post_max_size = 8M
memory_limit = 128M
max_execution_time = 30
display_errors = Off
log_errors = On
